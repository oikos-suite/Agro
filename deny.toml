# Supply-chain policy, checked in CI by `cargo deny check`.

[advisories]
version = 2
ignore = [
    # chrono is unmaintained (not a vulnerability) and has no successor release. It is used for
    # timestamps across the whole server, so replacing it with `jiff` or `time` is a migration
    # of its own, tracked in #71. Revisit this exception when that lands, or if a
    # vulnerability is reported against chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; migration to jiff/time tracked in #71" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
