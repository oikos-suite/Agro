sonar.projectKey=AgroUPlus_Agro
sonar.organization=agrouplus

# ── What is source and what is test ───────────────────────────────────────────────────────────
# The whole repository stays in scope, as before. Test files live beside the code they test, so
# they are named twice: as tests here, and as exclusions from the sources below, or they would be
# indexed as both. Rust keeps tests in `*_tests.rs`, `*_tests/`, `tests/` and `tests.rs`; the
# dashboard in `*.test.js(x)`, with shared test helpers in `dashboard/src/test/`.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=src/**/*_tests.rs,src/**/*_tests/**,src/**/tests/**,src/**/tests.rs,dashboard/src/**/*.test.js,dashboard/src/**/*.test.jsx,dashboard/src/test/**
sonar.exclusions=src/**/*_tests.rs,src/**/*_tests/**,src/**/tests/**,src/**/tests.rs,dashboard/src/**/*.test.js,dashboard/src/**/*.test.jsx,dashboard/src/test/**

# ── Coverage ──────────────────────────────────────────────────────────────────────────────────
# Written by the CI jobs and handed to the scan as artifacts; see .github/workflows/ci.yml.
#   Rust:      cargo llvm-cov, whole test suite, LCOV at the repository root.
#   Dashboard: vitest + @vitest/coverage-v8, LCOV with paths from the repository root.
sonar.rust.lcov.reportPaths=lcov.info
sonar.javascript.lcov.reportPaths=dashboard/coverage/lcov.info

# Code that no test suite runs: the promo site, maintenance scripts, the fuzz harness, and the
# dashboard's two entry points (the app's bootstrap and the build config).
sonar.coverage.exclusions=docs/**,scripts/**,fuzz/**,dashboard/vite.config.js,dashboard/src/main.jsx
